<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pronostics NBA">
  <!-- pas de fond : aucune couleur ne contraste correctement à la fois sur
       onglet clair et sombre (mesuré : 16,3:1 vs 1,1:1 pour #10203A), et le
       carré-pastille est une convention d'icône d'application, pas de
       favicon. Transparent, comme la marque de l'en-tête. -->

  <!-- part adverse -->
  <path d="M48.32 22.27 A19 19 0 0 1 45.44 45.44"
        fill="none" stroke="#7C8AA5" stroke-width="10.5" stroke-linecap="round"/>

  <!-- part du favori -->
  <path d="M18.57 45.44 A19 19 0 0 1 45.01 18.15"
        fill="none" stroke="#E8590C" stroke-width="10.5" stroke-linecap="round"/>

  <!-- ballon, sans coutures (illisibles sous 32 px) -->
  <circle cx="45.01" cy="18.15" r="7" fill="#E8590C"/>
</svg>
