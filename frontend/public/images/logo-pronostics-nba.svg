<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <defs>
    <clipPath id="ball">
      <circle cx="45.01" cy="18.15" r="7"/>
    </clipPath>
  </defs>

  <!-- part adverse : texte atténué, délibérément sourd -- subordonné au favori -->
  <path d="M48.32 22.27 A19 19 0 0 1 45.44 45.44"
        fill="none" stroke="var(--text-disabled)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- part du favori -->
  <path d="M18.57 45.44 A19 19 0 0 1 45.01 18.15"
        fill="none" stroke="var(--accent-fill, #F97316)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- ballon -->
  <circle cx="45.01" cy="18.15" r="7" fill="var(--accent-fill, #F97316)"/>
  <!-- coutures : couleur de surface, pas currentColor -- creusent le ballon comme
       des entailles, suivent le thème, indépendantes de l'axe d'accent -->
  <g clip-path="url(#ball)" fill="none" stroke="var(--surface)" stroke-width="1.5" stroke-linecap="round">
    <path d="M45.01 10.9 C41.3 14.3 41.3 22 45.01 25.4"/>
    <path d="M38 18.15 C41.4 15.7 48.6 15.7 52.02 18.15"/>
  </g>
</svg>
